<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vihaan Dutta - Portfolio</title>
    <!--
      Single Page App fallback for GitHub Pages.
      Deep links like /projects/foo would otherwise 404 on a static host. This
      page stashes the requested path into a query string and redirects to the
      app root, where the snippet in index.html restores it before React mounts.
      Technique: https://github.com/rafgraph/spa-github-pages (pathSegmentsToKeep = 0).
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
